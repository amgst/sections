<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="shopify-api-key" content="%%SHOPIFY_API_KEY%%" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>Section Factory Admin Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    .topbar {
      background: #111827;
      color: white;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .pill {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .install-btn {
      margin-top: 12px;
      display: inline-block;
      border: none;
      background: #111827;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .install-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .install-status {
      display: block;
      margin-top: 8px;
      font-size: 12px;
    }
    .install-status.error { color: #b91c1c; }
    .install-status.ok { color: #047857; }
    .install-status a { color: inherit; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1 style="margin:0;">Section Factory Admin</h1>
      <p style="margin:8px 0 0; color:#d1d5db;">Merchant dashboard for section templates and store blocks.</p>
    </div>

    <div class="card" id="shopInfo" style="margin-bottom:16px; display:none;">
      <div class="pill">Connected store</div>
      <div id="shopInfoText"></div>
    </div>

    <div class="grid" id="templateGrid"></div>
  </div>

  <script>
    async function getSessionToken() {
      const host = new URLSearchParams(window.location.search).get('host');
      if (!host || !window.shopify) return null;
      return window.shopify.idToken();
    }

    async function loadTemplates() {
      const res = await fetch('/api/sections');
      const templates = await res.json();
      const grid = document.getElementById('templateGrid');

      grid.innerHTML = templates.map((item) => `
        <div class="card">
          <div class="pill">${item.category}</div>
          <h3>${item.name}</h3>
          <p>${item.description}</p>
          <strong>${item.price}</strong>
          ${item.installable ? `
            <button class="install-btn" data-id="${item.id}">Add to theme</button>
            <span class="install-status" data-status-for="${item.id}"></span>
          ` : ''}
        </div>
      `).join('');

      grid.querySelectorAll('.install-btn').forEach((btn) => {
        btn.addEventListener('click', () => installSection(btn.dataset.id));
      });
    }

    async function installSection(id) {
      const btn = document.querySelector(`.install-btn[data-id="${id}"]`);
      const status = document.querySelector(`[data-status-for="${id}"]`);
      status.className = 'install-status';
      status.textContent = '';

      const token = await getSessionToken();
      if (!token) {
        status.className = 'install-status error';
        status.textContent = 'Open this app from inside Shopify admin to install sections.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Opening theme editor…';

      try {
        const res = await fetch(`/api/sections/${id}/install-link`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Could not create install link');
        }

        status.className = 'install-status ok';
        status.textContent = `Opening theme editor for "${result.theme}"…`;
        window.open(result.editorUrl, '_top');
      } catch (err) {
        status.className = 'install-status error';
        status.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Install to theme';
      }
    }

    async function loadShopInfo() {
      const token = await getSessionToken();
      if (!token) return;

      try {
        const res = await fetch('/api/shop', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const shop = await res.json();

        const box = document.getElementById('shopInfo');
        box.style.display = 'block';
        document.getElementById('shopInfoText').textContent =
          `${shop.name} (${shop.myshopifyDomain}) — ${shop.plan?.displayName ?? ''}`;
      } catch (err) {
        console.error('Failed to load shop info', err);
      }
    }

    loadTemplates();
    loadShopInfo();
  </script>
</body>
</html>
