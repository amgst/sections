<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="shopify-api-key" content="%%SHOPIFY_API_KEY%%" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>Section Factory Admin</title>
  <style>
    :root {
      --bg: #f1f2f4;
      --surface: #ffffff;
      --border: #e3e4e6;
      --text: #1a1c1d;
      --text-subdued: #6d7175;
      --green: #008060;
      --green-dark: #006e52;
      --green-tint: #e3f6ef;
      --gold-tint: #fdf3d4;
      --gold-text: #8a6116;
      --red-tint: #fbeae5;
      --red-text: #b91c1c;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(26,28,29,.06), 0 1px 6px rgba(26,28,29,.04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 56px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--text);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .topbar h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -.01em;
    }
    .topbar p {
      margin: 2px 0 0;
      color: var(--text-subdued);
      font-size: 12.5px;
    }
    .shop-chip {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px 6px 8px;
      font-size: 13px;
      box-shadow: var(--shadow);
    }
    .shop-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--green);
      flex-shrink: 0;
    }
    .shop-chip strong { font-weight: 600; }
    .shop-chip .muted { color: var(--text-subdued); }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .search-box {
      position: relative;
      flex: 1 1 260px;
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subdued);
      pointer-events: none;
    }
    .search-box input {
      width: 100%;
      padding: 11px 12px 11px 36px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    .search-box input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-tint);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 9px;
      padding: 0 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .btn-secondary:hover { background: var(--bg); }
    .btn-secondary.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    /* Category dropdown panel */
    .category-panel {
      display: none;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .category-panel.open { display: flex; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
      white-space: nowrap;
    }
    .chip:hover { border-color: #c9cccf; }
    .chip.active {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    /* Icon strip */
    .icon-strip-wrap {
      position: relative;
      margin-bottom: 24px;
    }
    .icon-strip {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 36px 4px 2px;
    }
    .icon-strip::-webkit-scrollbar { display: none; }
    .icon-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      background: none;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 2px;
    }
    .icon-item .icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-subdued);
      transition: border-color .12s, background .12s, color .12s;
    }
    .icon-item:hover .icon-circle { border-color: #c9cccf; }
    .icon-item.active .icon-circle {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    .icon-item.active { color: var(--text); font-weight: 650; }
    .icon-scroll-btn {
      position: absolute;
      right: 0;
      top: 2px;
      width: 30px;
      height: 40px;
      border: none;
      background: linear-gradient(90deg, transparent, var(--bg) 40%);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      color: var(--text-subdued);
    }

    /* Section rows */
    .row-section { margin-bottom: 30px; }
    .row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .row-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }
    .row-head button {
      border: 1px solid var(--border);
      background: var(--surface);
      width: 30px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
    }
    .row-head button:hover { background: var(--bg); }
    .card-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .card-row::-webkit-scrollbar { display: none; }
    .card-row .card { flex: 0 0 240px; }

    /* Grid (used for filtered / search results) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: box-shadow .15s, transform .15s;
    }
    .card:hover {
      box-shadow: 0 2px 4px rgba(26,28,29,.08), 0 4px 14px rgba(26,28,29,.08);
      transform: translateY(-1px);
    }
    .card-preview {
      position: relative;
      height: 128px;
      display: flex;
      align-items: flex-end;
      padding: 12px;
      overflow: hidden;
    }
    .card-preview .pill {
      position: relative;
      z-index: 1;
      display: inline-block;
      background: rgba(255,255,255,.9);
      color: #2a2c2e;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .01em;
    }
    .card-preview .mock-lines {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-preview .mock-lines span {
      display: block;
      height: 7px;
      border-radius: 4px;
      background: rgba(255,255,255,.55);
    }
    .card-preview .mock-lines span:nth-child(1) { width: 55%; }
    .card-preview .mock-lines span:nth-child(2) { width: 80%; height: 4px; opacity: .7; }

    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }
    .card h3 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 650;
    }
    .price-tag {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .price-tag.free { background: var(--green-tint); color: var(--green-dark); }
    .price-tag.pro { background: var(--gold-tint); color: var(--gold-text); }

    .card p.desc {
      margin: 4px 0 0;
      color: var(--text-subdued);
      font-size: 12.5px;
      line-height: 1.5;
      flex-grow: 1;
    }

    .install-btn {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      background: var(--green);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .12s;
    }
    .install-btn:hover:not(:disabled) { background: var(--green-dark); }
    .install-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }
    .install-btn .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 999px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .coming-soon {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-subdued);
      font-style: italic;
    }

    .install-status {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .install-status.error { color: var(--red-text); }
    .install-status.ok { color: var(--green-dark); }
    .install-status a { color: inherit; }

    /* Skeleton loading */
    .skel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
      flex: 0 0 240px;
    }
    .skel-card .skel-preview {
      height: 128px;
      background: linear-gradient(90deg, #eef0f1 25%, #e4e6e8 37%, #eef0f1 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    .skel-card .skel-body { padding: 12px 14px 14px; }
    .skel-line {
      background: linear-gradient(90deg, #eef0f1 25%, #e4e6e8 37%, #eef0f1 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 20px;
      color: var(--text-subdued);
    }
    .empty-state svg { margin-bottom: 12px; opacity: .5; }
    .empty-state p { margin: 0; font-size: 14px; }

    /* Theme picker modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,28,29,.45);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-subdued);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      border-radius: 999px;
    }
    .modal-close:hover { background: var(--bg); color: var(--text); }
    .modal-header {
      padding: 22px 40px 4px 22px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }
    .modal-header p {
      margin: 6px 0 0;
      font-size: 13.5px;
      color: var(--text-subdued);
    }
    .modal-body {
      padding: 16px 22px 4px;
      overflow: visible;
      flex: 1;
    }

    /* Split button theme picker */
    .theme-picker { position: relative; }
    .split-btn {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
    }
    .split-main {
      margin-top: 0;
      flex: 1;
      border-radius: 8px 0 0 8px;
      text-align: left;
      justify-content: flex-start;
      padding-left: 16px;
    }
    .split-toggle {
      flex-shrink: 0;
      width: 40px;
      border: none;
      border-left: 1px solid rgba(255,255,255,.25);
      background: var(--green);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 8px 8px 0;
      transition: background .12s;
    }
    .split-toggle:hover { background: var(--green-dark); }
    .split-toggle svg { transition: transform .12s; }
    .theme-picker.open .split-toggle svg { transform: rotate(180deg); }

    .theme-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(26,28,29,.14);
      z-index: 5;
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
    }
    .theme-picker.open .theme-dropdown { display: block; }
    .theme-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .theme-row:hover { background: var(--bg); }
    .theme-row.selected { background: var(--green-tint); }
    .theme-row .check {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--green);
      visibility: hidden;
    }
    .theme-row.selected .check { visibility: visible; }
    .theme-row .theme-name {
      font-size: 13.5px;
      font-weight: 550;
      flex: 1;
    }
    .theme-row .live-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--green-dark);
      background: var(--green-tint);
      padding: 3px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .modal-guidance {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--gold-tint);
      color: var(--gold-text);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .modal-guidance strong { font-weight: 700; }

    .modal-caption {
      margin: 10px 0 0;
      font-size: 12.5px;
      color: var(--text-subdued);
    }
    .modal-caption strong { color: var(--text); font-weight: 600; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 18px 22px 20px;
    }
    .btn-cancel {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-msg {
      padding: 20px 0;
      font-size: 13.5px;
      color: var(--text-subdued);
    }
    .modal-msg.error { color: var(--red-text); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">S</span>
        <div>
          <h1>Section Factory</h1>
          <p>Browse section templates and add them to your theme.</p>
        </div>
      </div>
      <div class="shop-chip" id="shopInfo">
        <span class="dot"></span>
        <span id="shopInfoText"></span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M18 18L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search sections…" autocomplete="off" />
      </div>
      <button class="btn-secondary" id="requestBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Request a section
      </button>
      <button class="btn-secondary" id="categoriesBtn" type="button">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M6 10h8M8.5 15h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Categories
      </button>
    </div>

    <div class="category-panel" id="categoryPanel"></div>

    <div class="icon-strip-wrap">
      <div class="icon-strip" id="iconStrip"></div>
      <button class="icon-scroll-btn" id="iconScrollBtn" aria-label="Scroll categories">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="content">
      <div class="row-section">
        <div class="skel-card" style="flex:0 0 100%;"><div class="skel-preview"></div></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="themeModalOverlay">
    <div class="modal">
      <button class="modal-close" id="themeModalClose" aria-label="Close" type="button">&times;</button>
      <div class="modal-header">
        <h2 id="themeModalTitle">It's yours 🎉</h2>
        <p>Let's add it to your theme so you can start using it.</p>
      </div>
      <div class="modal-body" id="themeModalBody"></div>
      <div class="modal-footer">
        <button class="btn-cancel" id="themeModalCancel">I'll do this later</button>
      </div>
    </div>
  </div>

  <script>
    let allTemplates = [];
    let activeCategory = 'All';
    let activeTag = null;
    let searchTerm = '';

    const GRADIENTS = {
      Hero: ['#1f6f5c', '#0b3d33'],
      Features: ['#2f5c8a', '#16324f'],
      Testimonial: ['#caa23a', '#8a6d1f'],
      Video: ['#7a3fae', '#3f1f66'],
      Countdown: ['#b8433c', '#732622'],
      Scrolling: ['#3a7d7d', '#1f4a4a'],
      Images: ['#c25b8e', '#732e54'],
      Snippet: ['#4b4f54', '#232527'],
      Text: ['#2c2f33', '#101214'],
      Cart: ['#1f5c3f', '#0e3324']
    };
    function gradientFor(category) {
      const g = GRADIENTS[category] || ['#5c6066', '#2c2f33'];
      return `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
    }

    const ICON_STRIP = [
      { key: 'popular', label: 'Popular', icon: '<path d="M10 3l1.9 4.6 5 .4-3.8 3.3 1.2 4.9L10 13.8 5.7 16.2l1.2-4.9L3.1 8l5-.4L10 3z" fill="currentColor"/>' },
      { key: 'trending', label: 'Trending', icon: '<path d="M4 13l4-4 3 3 5-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M12 6h4v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
      { key: 'newest', label: 'Newest', icon: '<path d="M10 3v3M10 14v3M3 10h3M14 10h3M5.5 5.5l2 2M12.5 12.5l2 2M5.5 14.5l2-2M12.5 7.5l2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
      { key: 'free', label: 'Free', icon: '<rect x="3" y="8" width="14" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 8V6a2 2 0 10-3.5-1.3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>' },
      { key: 'features', label: 'Features', icon: '<circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 6.5v4l2.5 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
      { key: 'testimonial', label: 'Testimonial', icon: '<path d="M4 5h12v7H8l-3 3v-3H4V5z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>' },
      { key: 'scrolling', label: 'Scrolling', icon: '<path d="M6 8l-3 2 3 2M14 8l3 2-3 2M9 5l2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>' },
      { key: 'hero', label: 'Hero', icon: '<rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M3 13l4-3 3 2 4-4 3 2" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
      { key: 'video', label: 'Video', icon: '<rect x="3" y="5" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M13 9l4-2.5v7L13 11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/>' },
      { key: 'countdown', label: 'Countdown', icon: '<circle cx="10" cy="11" r="6" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10 8v3l2 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 3h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' },
      { key: 'images', label: 'Images', icon: '<rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/><path d="M4 14l4-3.5 3 2.5 3-3 3 2.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/>' },
      { key: 'snippet', label: 'Snippet', icon: '<path d="M7 5L3 10l4 5M13 5l4 5-4 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
      { key: 'text', label: 'Text', icon: '<path d="M4 5h12M10 5v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' },
      { key: 'cart', label: 'Cart', icon: '<path d="M3 4h2l1.6 9.2a1.6 1.6 0 001.6 1.3h6.6a1.6 1.6 0 001.6-1.3L18 7H5.3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="17" r="1.1" fill="currentColor"/><circle cx="14.5" cy="17" r="1.1" fill="currentColor"/>' }
    ];

    async function getSessionToken() {
      const host = new URLSearchParams(window.location.search).get('host');
      if (!host || !window.shopify) return null;
      return window.shopify.idToken();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderIconStrip() {
      const wrap = document.getElementById('iconStrip');
      wrap.innerHTML = ICON_STRIP.map((item) => `
        <button class="icon-item ${activeTag === item.key ? 'active' : ''}" data-tag="${item.key}" type="button">
          <span class="icon-circle"><svg width="17" height="17" viewBox="0 0 20 20">${item.icon}</svg></span>
          ${escapeHtml(item.label)}
        </button>
      `).join('');
      wrap.querySelectorAll('.icon-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.tag;
          activeTag = activeTag === key ? null : key;
          renderIconStrip();
          renderContent();
        });
      });
    }

    document.getElementById('iconScrollBtn').addEventListener('click', () => {
      document.getElementById('iconStrip').scrollBy({ left: 220, behavior: 'smooth' });
    });

    function renderCategoryPanel() {
      const categories = ['All', ...new Set(allTemplates.map((t) => t.category))];
      const panel = document.getElementById('categoryPanel');
      panel.innerHTML = categories.map((c) => `
        <button class="chip ${c === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(c)}" type="button">${escapeHtml(c)}</button>
      `).join('');
      panel.querySelectorAll('.chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          renderCategoryPanel();
          renderContent();
        });
      });
    }

    document.getElementById('categoriesBtn').addEventListener('click', (e) => {
      document.getElementById('categoryPanel').classList.toggle('open');
      e.currentTarget.classList.toggle('active');
    });

    document.getElementById('requestBtn').addEventListener('click', () => {
      window.open('mailto:support@sectionfactory.app?subject=Section%20request', '_top');
    });

    function cardHtml(item) {
      return `
        <div class="card">
          <div class="card-preview" style="background:${gradientFor(item.category)}">
            <div class="mock-lines"><span></span><span></span></div>
            <span class="pill">${escapeHtml(item.category)}</span>
          </div>
          <div class="card-body">
            <div class="card-title-row">
              <h3>${escapeHtml(item.name)}</h3>
              <span class="price-tag ${item.price.toLowerCase() === 'free' ? 'free' : 'pro'}">${escapeHtml(item.price)}</span>
            </div>
            <p class="desc">${escapeHtml(item.description)}</p>
            ${item.installable ? `
              <button class="install-btn" data-id="${item.id}">Add to theme</button>
              <span class="install-status" data-status-for="${item.id}"></span>
            ` : `
              <div class="coming-soon">Not installable yet</div>
            `}
          </div>
        </div>
      `;
    }

    function bindInstallButtons(scope) {
      scope.querySelectorAll('.install-btn').forEach((btn) => {
        btn.addEventListener('click', () => openThemeModal(btn.dataset.id));
      });
    }

    function emptyStateHtml() {
      return `
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M18 18L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <p>No sections match your search.</p>
        </div>
      `;
    }

    function scrollRow(id, dir) {
      document.getElementById(id).scrollBy({ left: dir * 500, behavior: 'smooth' });
    }
    window.scrollRow = scrollRow;

    function renderContent() {
      const content = document.getElementById('content');
      const isFiltering = activeCategory !== 'All' || activeTag || searchTerm;

      const matchesSearch = (item) =>
        !searchTerm ||
        item.name.toLowerCase().includes(searchTerm) ||
        item.description.toLowerCase().includes(searchTerm);

      if (isFiltering) {
        const filtered = allTemplates.filter((item) =>
          (activeCategory === 'All' || item.category === activeCategory) &&
          (!activeTag || (item.tags || []).includes(activeTag)) &&
          matchesSearch(item)
        );

        content.innerHTML = `
          <div class="row-section">
            <div class="row-head"><h2>Results</h2></div>
            <div class="grid">${filtered.length ? filtered.map(cardHtml).join('') : emptyStateHtml()}</div>
          </div>
        `;
        bindInstallButtons(content);
        return;
      }

      const rows = [
        { id: 'rowTrending', title: 'Trending Sections', items: allTemplates.filter((t) => (t.tags || []).includes('trending')) },
        { id: 'rowNewest', title: 'Newest Releases', items: allTemplates.filter((t) => (t.tags || []).includes('newest')) },
        { id: 'rowFree', title: 'Free Sections', items: allTemplates.filter((t) => t.price === 'Free') }
      ].filter((row) => row.items.length);

      content.innerHTML = rows.map((row) => `
        <div class="row-section">
          <div class="row-head">
            <h2>${escapeHtml(row.title)}</h2>
            <button type="button" onclick="scrollRow('${row.id}', 1)" aria-label="Scroll right">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M7.5 4.5l5.5 5.5-5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="card-row" id="${row.id}">${row.items.map(cardHtml).join('')}</div>
        </div>
      `).join('');
      bindInstallButtons(content);
    }

    async function loadTemplates() {
      const res = await fetch('/api/sections');
      allTemplates = await res.json();
      renderIconStrip();
      renderCategoryPanel();
      renderContent();
    }

    let themesCache = null;
    let modalSectionId = null;
    let modalSelectedThemeId = null;

    const themeModalOverlay = document.getElementById('themeModalOverlay');
    const themeModalBody = document.getElementById('themeModalBody');
    const themeModalTitle = document.getElementById('themeModalTitle');

    async function openThemeModal(sectionId) {
      modalSectionId = sectionId;
      modalSelectedThemeId = null;

      const section = allTemplates.find((t) => t.id === sectionId);
      themeModalTitle.textContent = section ? `"${section.name}" is yours 🎉` : "It's yours 🎉";

      themeModalOverlay.classList.add('open');
      themeModalBody.innerHTML = '<div class="modal-msg">Loading your themes…</div>';

      const token = await getSessionToken();
      if (!token) {
        themeModalBody.innerHTML = '<div class="modal-msg error">Open this app from inside Shopify admin to install sections.</div>';
        return;
      }

      try {
        if (!themesCache) {
          const res = await fetch('/api/themes', { headers: { Authorization: `Bearer ${token}` } });
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || 'Could not load themes');
          themesCache = result.themes;
        }

        if (!themesCache.length) {
          themeModalBody.innerHTML = '<div class="modal-msg">No themes found on this store.</div>';
          return;
        }

        const liveTheme = themesCache.find((t) => t.role === 'MAIN');
        modalSelectedThemeId = (liveTheme || themesCache[0]).id;
        renderThemePicker();
      } catch (err) {
        themeModalBody.innerHTML = `<div class="modal-msg error">${escapeHtml(err.message)}</div>`;
      }
    }

    function selectedTheme() {
      return themesCache.find((t) => t.id === modalSelectedThemeId);
    }

    function renderThemePicker() {
      const theme = selectedTheme();
      const section = allTemplates.find((t) => t.id === modalSectionId);
      const designLabel = section && section.block && section.block.designLabel;

      themeModalBody.innerHTML = `
        <div class="theme-picker" id="themePicker">
          <div class="split-btn">
            <button class="install-btn split-main" id="themeInstallBtn" type="button">Add to theme</button>
            <button class="split-toggle" id="themeToggleBtn" type="button" aria-haspopup="listbox" aria-label="Choose theme">
              <svg width="12" height="12" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="theme-dropdown" id="themeDropdown" role="listbox">
            ${themesCache.map((t) => `
              <div class="theme-row ${t.id === modalSelectedThemeId ? 'selected' : ''}" data-theme-id="${t.id}" role="option">
                <svg class="check" viewBox="0 0 20 20" fill="none"><path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="theme-name">${escapeHtml(t.name)}</span>
                ${t.role === 'MAIN' ? '<span class="live-badge">Live</span>' : ''}
              </div>
            `).join('')}
          </div>
        </div>
        ${designLabel ? `
          <p class="modal-guidance">
            This block supports several designs. Once the settings panel opens in the theme editor, set <strong>Design → ${escapeHtml(designLabel)}</strong> to get the exact look shown in the catalog.
          </p>
        ` : ''}
        <p class="modal-caption">Adds section with default settings to <strong id="selectedThemeName">${escapeHtml(theme.name)}</strong>.</p>
      `;

      const picker = document.getElementById('themePicker');

      document.getElementById('themeToggleBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        picker.classList.toggle('open');
      });

      picker.querySelectorAll('.theme-row').forEach((row) => {
        row.addEventListener('click', () => {
          modalSelectedThemeId = row.dataset.themeId;
          picker.classList.remove('open');
          renderThemePicker();
        });
      });

      document.getElementById('themeInstallBtn').addEventListener('click', () => {
        if (modalSectionId && modalSelectedThemeId) {
          installSection(modalSectionId, modalSelectedThemeId);
        }
      });
    }

    document.addEventListener('click', (e) => {
      const picker = document.getElementById('themePicker');
      if (picker && !picker.contains(e.target)) picker.classList.remove('open');
    });

    function closeThemeModal() {
      themeModalOverlay.classList.remove('open');
      modalSectionId = null;
    }

    document.getElementById('themeModalCancel').addEventListener('click', closeThemeModal);
    document.getElementById('themeModalClose').addEventListener('click', closeThemeModal);
    themeModalOverlay.addEventListener('click', (e) => {
      if (e.target === themeModalOverlay) closeThemeModal();
    });

    async function installSection(id, themeId) {
      const status = document.querySelector(`[data-status-for="${id}"]`);
      if (status) {
        status.className = 'install-status';
        status.textContent = '';
      }

      const token = await getSessionToken();
      if (!token) {
        closeThemeModal();
        if (status) {
          status.className = 'install-status error';
          status.textContent = 'Open this app from inside Shopify admin to install sections.';
        }
        return;
      }

      const installBtn = document.getElementById('themeInstallBtn');
      if (installBtn) {
        installBtn.disabled = true;
        installBtn.innerHTML = '<span class="spinner"></span> Opening theme editor…';
      }

      try {
        const res = await fetch(`/api/sections/${id}/install-link?themeId=${encodeURIComponent(themeId)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || 'Could not create install link');
        }

        if (status) {
          status.className = 'install-status ok';
          status.textContent = `Opening theme editor for "${result.theme}"…`;
        }
        closeThemeModal();
        window.open(result.editorUrl, '_top');
      } catch (err) {
        themeModalBody.innerHTML = `<div class="modal-msg error">${escapeHtml(err.message)}</div>`;
      } finally {
        if (installBtn) {
          installBtn.disabled = false;
          installBtn.textContent = 'Add to theme';
        }
      }
    }

    async function loadShopInfo() {
      const token = await getSessionToken();
      if (!token) return;

      try {
        const res = await fetch('/api/shop', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) return;
        const shop = await res.json();

        const box = document.getElementById('shopInfo');
        box.style.display = 'inline-flex';
        document.getElementById('shopInfoText').innerHTML =
          `<strong>${escapeHtml(shop.name)}</strong> <span class="muted">${escapeHtml(shop.plan?.displayName ?? '')}</span>`;
      } catch (err) {
        console.error('Failed to load shop info', err);
      }
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim().toLowerCase();
      renderContent();
    });

    loadTemplates();
    loadShopInfo();
  </script>
</body>
</html>
